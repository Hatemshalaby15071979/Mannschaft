# German voice profiles — the ONLY place voices are named.
#
# `profile_id` is the id returned by VoiceStudio for each design voice (M4).
# These six were created via POST /profiles (kind=design) with language=German
# and distinct seeds; vd_states were derived from each voice's gender/age/pitch
# via VoiceStudio's own instruct_to_vd_states(). Verified through the exact
# render path (/v1/audio/speech) — all six resolve to distinct German profiles.
# Every renderer MUST refuse to run while any profile_id is empty.
#
# `instruct` is derived from gender/age/pitch/whisper — do NOT write free text.
# VoiceStudio's whitelist (omnivoice/utils/voice_design.py) drops anything else:
#   gender : male | female
#   age    : child | teenager | young adult | middle-aged | elderly
#   pitch  : very low | low | moderate | high | very high
#   whisper: whisper
# Accents are English-only and must be omitted for German.
#
# Seeds must be distinct across voices: identical seeds push models toward
# identical timbre. 445117530 is already used by the two existing English
# profiles — do not reuse it.

[voices.de_narrator_f]
name = "DE Narrator (f)"
profile_id = "a22b40a0"
seed = 712340011
gender = "female"
age = "young adult"
pitch = "moderate pitch"
whisper = false
language = "German"
use = ["scene", "note", "recap"]

