name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest

      - name: Validate lessons
        run: python -m v5 validate --all

      - name: Build core distribution
        if: matrix.python-version == '3.12'
        run: make dist-core

      - name: Upload core distribution
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: mannschaft-core
          path: dist/mannschaft-core.zip
          if-no-files-found: error

  # GOVERNANCE.md section 2: the root holds only the documented set. The gate parses
  # that table out of GOVERNANCE.md, asserts both directions (every named document is
  # present, and no unlisted .md/.txt sits at the root), and self-tests that it fails
  # closed. It needs nothing but python3 and a checkout.
  governance:
    name: root-document hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Root-document hygiene (GOVERNANCE.md section 2)
        run: |
          python3 scripts/check_root_docs.py
          python3 scripts/check_root_docs.py --self-test
