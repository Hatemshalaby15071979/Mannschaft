<?xml version="1.0" encoding="UTF-8"?>
<!-- Helix Solutions — canonical master logo. Clean gold mark: triangle + circle on dark rounded-rect. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="hs-logo-title">
  <title id="hs-logo-title">Helix Solutions</title>
  <defs>
    <linearGradient id="hs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#C9A44F"/>
    </linearGradient>
    <filter id="hs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="88" fill="#060607"/>
  <g filter="url(#hs-glow)">
    <!-- Triangle: the "peak" -->
    <path d="M256 112 L344 256 L168 256 Z"
          stroke="url(#hs-gold)" stroke-width="12" stroke-linejoin="round" fill="none"/>
    <!-- Outer circle: the "governance ring" -->
    <circle cx="256" cy="368" r="44"
            stroke="url(#hs-gold)" stroke-width="10" fill="none"/>
    <!-- Inner dot: the "human in charge" -->
    <circle cx="256" cy="368" r="17" fill="#F5F1E6"/>
  </g>
</svg>