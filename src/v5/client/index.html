<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Hören zuerst. Deutsch von A1 bis C2.">
  <title>v5 · Deutsch hören</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#screen">Zum Inhalt</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Startseite">v5</a>
    <span class="level-pill" id="level-pill" hidden></span>
    <button class="icon-button" id="help-toggle" type="button"
            aria-expanded="false" aria-controls="help-panel" title="Tastatur (?)">?</button>
  </header>

  <div class="help-panel" id="help-panel" hidden>
    <h2>Tastatur</h2>
    <dl>
      <div><dt><kbd>Space</kbd></dt><dd>Abspielen / Pause</dd></div>
      <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>5 Sekunden zurück / vor</dd></div>
      <div><dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>Vorheriger / nächster Satz</dd></div>
      <div><dt><kbd>T</kbd></dt><dd>Übersetzung zeigen</dd></div>
      <div><dt><kbd>S</kbd></dt><dd>Tempo 0,7 / 0,85 / 1,0</dd></div>
      <div><dt><kbd>?</kbd></dt><dd>Diese Hilfe</dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd>Zurück</dd></div>
    </dl>
  </div>

  <main id="screen" tabindex="-1">
    <p class="loading">Lädt …</p>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/" data-nav="home">Heute</a>
    <a href="#/library" data-nav="library">Bibliothek</a>
    <a href="#/progress" data-nav="progress">Fortschritt</a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="loading">Diese App braucht JavaScript.</p></noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
